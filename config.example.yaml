# =========================================
# IcePoint Coffee - 配置文件示例
# 复制到 ~/.icepoint/config.yaml 并修改
# =========================================

# AI 配置（可选，不填则使用 Mock AI）
ai:
  # OpenAI 兼容 API 地址
  # 支持: OpenAI / DeepSeek / 阿里云 / 本地模型 等
  base_url: "https://api.openai.com/v1"
  
  # API Key（从对应平台获取）
  api_key: "sk-your-api-key-here"
  
  # 模型名称
  model: "gpt-3.5-turbo"
  
  # 请求超时（秒）
  timeout: 30

# 服务器连接配置
server:
  # 租赁服房间号（房间 ID）
  address: "12345678"
  
  # 玩家名称
  player_name: "IcePoint"

# 数据库配置
db:
  # 数据库文件路径（支持 ~ 展开）
  path: "~/.icepoint/data.db"

# 插件配置
plugin:
  # 插件目录
  dir: "./plugins"
  
  # HTTP RPC 服务端口（设为 0 则不启动）
  # Dashboard 地址: http://localhost:<port>/
  http_port: 8080
